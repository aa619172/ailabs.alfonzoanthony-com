name: Prompt Lab Regression Gate

on:
  pull_request:
    paths:
      - 'labs/ai-security-adversarial-testing/**'
      - 'prompt-security-lab.*'
      - 'prompt-experiments.css'
      - 'target-adapter.html'
      - 'prompt-trends.html'
      - 'prompt-evaluation-dashboard.html'
      - 'prompt-dashboard.*'
      - 'case-study-ai-security-lab.html'
      - 'build-prompt-lab.mjs'
      - 'package.json'
      - 'PROVENANCE.md'
      - '.github/workflows/prompt-lab-regression.yml'
  push:
    branches:
      - main
      - portfolio-hook-revamp-2026-09-04
    paths:
      - 'labs/ai-security-adversarial-testing/**'
      - 'prompt-security-lab.*'
      - 'prompt-experiments.css'
      - 'target-adapter.html'
      - 'prompt-trends.html'
      - 'prompt-evaluation-dashboard.html'
      - 'prompt-dashboard.*'
      - 'case-study-ai-security-lab.html'
      - 'build-prompt-lab.mjs'
      - 'package.json'
      - 'PROVENANCE.md'
      - '.github/workflows/prompt-lab-regression.yml'

jobs:
  prompt-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/ai-security-adversarial-testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Run prompt regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate deterministic experiment report
        run: python run_lab.py > prompt-regression-report.json

      - name: Generate employer-facing assessment reports
        run: python generate_report.py

      - name: Run end-to-end localhost target evaluation
        run: |
          python demo_target_server.py --port 8765 > demo-target.log 2>&1 &
          echo $! > demo-target.pid
          python - <<'PY'
          import socket
          import time

          for _ in range(50):
              try:
                  with socket.create_connection(('127.0.0.1', 8765), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('Local prompt target did not become ready')
          PY
          python run_target.py \
            --endpoint http://127.0.0.1:8765/evaluate \
            --architecture v2 \
            --runs 3 \
            --output demo-authorized-target.json
          python generate_target_comparison.py \
            --target-report demo-authorized-target.json \
            --output-dir reports/authorized-target
          python record_evaluation.py \
            --report demo-authorized-target.json \
            --history reports/history/ci-demo-history.jsonl \
            --target-label localhost-demo-target \
            --prompt-version PROMPT-ARCH-V2.0 \
            --source ci-authorized-localhost \
            --note '36-execution structured-observation CI demonstration'
          python generate_trend_report.py \
            --history reports/history/ci-demo-history.jsonl \
            --include-controlled-releases \
            --output-dir reports/trends
          kill "$(cat demo-target.pid)" || true

      - name: Verify prompt engineering invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('prompt-regression-report.json').read_text())
          comparison = report['phase_2_comparison']
          timeline = report['prompt_experiment_timeline']
          agent = report['agent_orchestration_integration']

          assert comparison['before']['total_attacks'] == 12
          assert comparison['before']['successful_attacks'] == 12
          assert comparison['before']['risk_score'] == 84
          assert comparison['after']['successful_attacks'] == 0
          assert comparison['after']['risk_score'] == 0
          assert len(comparison['version_history']) == 12

          assert [item['version']['id'] for item in timeline] == [
              'PROMPT-ARCH-V1.0',
              'PROMPT-ARCH-V1.1',
              'PROMPT-ARCH-V1.2',
              'PROMPT-ARCH-V2.0',
          ]
          assert [item['failed_tests'] for item in timeline] == [12, 9, 6, 0]
          assert [item['risk_score'] for item in timeline] == [84, 66, 42, 0]
          assert all(item['regression_status'] == 'PASS' for item in timeline[1:])

          assert agent['baseline']['failed'] is True
          assert agent['hardened']['failed'] is False
          assert len(agent['agent_contracts']) == 3

          html_report = Path('reports/prompt-assessment-report.html')
          json_report = Path('reports/prompt-assessment-report.json')
          assert html_report.exists() and json_report.exists()
          assert 'PROMPT-ARCH-V2.0' in html_report.read_text()

          target = json.loads(Path('demo-authorized-target.json').read_text())
          assert target['runs'] == 3
          assert target['total_executions'] == 36
          assert target['successful_attacks'] == 0
          assert target['attack_success_rate'] == 0.0
          assert target['schema_compliance_rate'] == 100.0
          assert target['evaluation_modes']['structured-observation'] == 12
          assert target['evaluation_modes']['text-marker-fallback'] == 0

          target_comparison = json.loads(Path('reports/authorized-target/authorized-target-comparison.json').read_text())
          assert target_comparison['deterministic_references']['v1']['attack_success_rate'] == 100.0
          assert target_comparison['deterministic_references']['v2']['attack_success_rate'] == 0.0
          assert target_comparison['authorized_target']['total_executions'] == 36
          assert target_comparison['authorized_target']['schema_compliance_rate'] == 100.0

          trends = json.loads(Path('reports/trends/prompt-evaluation-trends.json').read_text())
          assert trends['record_count'] == 5
          assert trends['target_stream_count'] == 2
          assert trends['regression_event_count'] == 0
          controlled = trends['streams']['deterministic-prompt-architecture']
          assert controlled['first_attack_success_rate'] == 100.0
          assert controlled['latest_attack_success_rate'] == 0.0
          assert controlled['risk_score_change'] == -84.0
          live_demo = trends['streams']['localhost-demo-target']
          assert live_demo['records'] == 1
          assert live_demo['latest_attack_success_rate'] == 0.0

          print('Prompt evaluation engine verified: releases, agent integration, 36 HTTP executions, target comparison, history, and trends')
          PY

      - name: Check dashboard JavaScript syntax
        working-directory: ${{ github.workspace }}
        run: node --check prompt-dashboard.js

      - name: Build production portfolio
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npm run build

      - name: Verify production Prompt Lab provenance
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          dist = Path('dist')
          manifest = json.loads((dist / 'provenance-manifest.json').read_text())
          assert manifest['schema_version'] == '1.1'
          prompt_projects = [p for p in manifest['projects'] if p['id'] == 'AA-AILAB-SEC-009']
          assert len(prompt_projects) == 1
          prompt = prompt_projects[0]

          expected_surfaces = {
              'case-study': 'case-study-ai-security-lab.html',
              'interactive-workbench': 'prompt-security-lab.html',
              'authorized-target-adapter': 'target-adapter.html',
              'evaluation-trends': 'prompt-trends.html',
              'evaluation-dashboard': 'prompt-evaluation-dashboard.html',
          }
          actual = {item['role']: item for item in prompt['surfaces']}
          assert set(actual) == set(expected_surfaces)

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for role, name in expected_surfaces.items():
              page = dist / name
              assert page.exists(), name
              text = page.read_text(encoding='utf-8')
              assert 'AA-AILAB-SEC-009' in text
              assert 'name="portfolio-provenance-id"' in text
              assert 'data-prompt-lab-provenance-jsonld' in text
              assert 'data-prompt-lab-signature' in text
              assert actual[role]['path'] == name
              assert actual[role]['sha256'] == sha256(page)
              assert len(actual[role]['sha256']) == 64

          support = {item['path']: item['sha256'] for item in prompt['support_files']}
          for name in ('prompt-dashboard.js', 'prompt-dashboard.css', 'prompt-security-lab.js', 'hook.css'):
              path = dist / name
              assert path.exists(), name
              assert support[name] == sha256(path)

          dashboard = (dist / 'prompt-evaluation-dashboard.html').read_text(encoding='utf-8')
          assert 'SAME-STREAM VERSION COMPARISON' in dashboard
          assert 'Import local JSON' in dashboard
          assert '<script src="script.js"></script>' not in dashboard

          print('Production provenance verified: 5 Prompt Lab surfaces + support hashes under AA-AILAB-SEC-009')
          PY

      - name: Upload prompt assessment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prompt-engineering-assessment
          path: |
            labs/ai-security-adversarial-testing/prompt-regression-report.json
            labs/ai-security-adversarial-testing/reports/prompt-assessment-report.json
            labs/ai-security-adversarial-testing/reports/prompt-assessment-report.html
            labs/ai-security-adversarial-testing/demo-authorized-target.json
            labs/ai-security-adversarial-testing/reports/authorized-target/authorized-target-comparison.json
            labs/ai-security-adversarial-testing/reports/authorized-target/authorized-target-comparison.html
            labs/ai-security-adversarial-testing/reports/history/ci-demo-history.jsonl
            labs/ai-security-adversarial-testing/reports/trends/prompt-evaluation-trends.json
            labs/ai-security-adversarial-testing/reports/trends/prompt-evaluation-trends.html
            labs/ai-security-adversarial-testing/demo-target.log
            dist/provenance-manifest.json
