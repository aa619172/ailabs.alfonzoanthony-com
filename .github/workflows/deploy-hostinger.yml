name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-ailabs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Hostinger FTP credentials
        shell: bash
        run: |
          missing=0
          for var in HOSTINGER_FTP_SERVER HOSTINGER_FTP_USERNAME HOSTINGER_FTP_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing GitHub Actions secret: $var"
              missing=1
            fi
          done
          exit "$missing"

      - name: Diagnose FTP login root
        shell: bash
        run: |
          python - <<'PY'
          import ftplib
          import os

          host = os.environ['HOSTINGER_FTP_SERVER'].strip()
          if host.startswith('ftp://'):
              host = host[6:]

          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=20)
          ftp.login(
              os.environ['HOSTINGER_FTP_USERNAME'],
              os.environ['HOSTINGER_FTP_PASSWORD'],
          )
          print('FTP working directory:', ftp.pwd())
          print('FTP root entries:')
          for entry in ftp.nlst():
              print(' -', entry)
          ftp.quit()
          PY

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy dist to live Hostinger root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.HOSTINGER_FTP_SERVER }}
          username: ${{ env.HOSTINGER_FTP_USERNAME }}
          password: ${{ env.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
