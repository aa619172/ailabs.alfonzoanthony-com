<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">GPU Fleet Lab architecture preview</title><desc id="desc">A dark systems dashboard illustration showing four GPUs, workload scheduling, topology, telemetry, and observability.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0d1f34"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20d8c2"/><stop offset="1" stop-color="#65a9ff"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="92" fill="#f7fbff" font-size="52" font-weight="700">GPU Fleet Lab</text><text x="72" y="132" fill="#8db2d6" font-size="22">GPU health · topology-aware scheduling · capacity control</text><rect x="72" y="172" width="1038" height="92" rx="18" fill="#0f2034" stroke="#223b57"/><g fill="#f4f8ff" font-size="20" font-weight="700"><text x="100" y="211">4/4</text><text x="273" y="211">288 GB</text><text x="478" y="211">NVLink</text><text x="684" y="211">DCGM</text><text x="884" y="211">Prometheus</text></g><g fill="#86a9c9" font-size="15"><text x="100" y="238">HEALTHY GPUS</text><text x="273" y="238">FLEET VRAM</text><text x="478" y="238">TOPOLOGY</text><text x="684" y="238">TELEMETRY</text><text x="884" y="238">OBSERVABILITY</text></g><rect x="72" y="300" width="650" height="300" rx="20" fill="#0b1829" stroke="#223b57"/><text x="100" y="342" fill="#f7fbff" font-size="24" font-weight="700">GPU Fleet</text><g font-size="17"><g fill="#8fb3d4"><text x="100" y="386">GPU</text><text x="280" y="386">Health</text><text x="430" y="386">Util.</text><text x="550" y="386">VRAM</text></g><g fill="#f7fbff"><text x="100" y="430">gpu-01 · H100</text><text x="100" y="478">gpu-02 · H100</text><text x="100" y="526">gpu-03 · A100</text><text x="100" y="574">gpu-04 · L40S</text></g><g fill="#5